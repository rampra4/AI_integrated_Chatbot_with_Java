# Here i am using the OpenAI API key, you can get it from https://platform.openai.com/account/api-keys
# You can also use other providers, please refer to the Spring AI documentation for more information: https://docs.spring.io/spring-ai/docs/current/reference/html/#openai
spring.ai.openai.api-key = "your_api_key"
spring.ai.openai.base-url= https://api.openai.com/v1
#  this baase url is for the OpenAI API, you can change it to your own if you are using a different provider
#  for more information, please refer to the Spring AI documentation: https://docs.spring.io/spring-ai/docs/current/reference/html/#openai
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.model=gemini-3-flash


# Using mySQL database for storing chat memory, you can change it to your own database if you want
# Chat memory is used to store the conversation history, so that the AI can remember the context of the conversation
spring.datasource.url=jdbc:mysql://localhost:3306/springai
spring.datasource.username="yourusername"
spring.datasource.password="yourpassword"
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

logging.level.org.springframework.ai.chat.client.advisor=DEBUG


